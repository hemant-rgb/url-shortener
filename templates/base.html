<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}URL Shortener{% endblock %}</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a2e;
    --surface2: #16213e;
    --primary: #e94560;
    --primary-hover: #ff6b81;
    --accent: #0f3460;
    --text: #eaeaea;
    --text-muted: #8892b0;
    --border: #233554;
    --success: #64ffda;
    --radius: 12px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { color: var(--primary-hover); }

  /* Navigation */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 2rem;
  }
  nav .brand {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -0.5px;
  }
  nav .brand span { color: var(--text); }
  nav .links { display: flex; gap: 1.5rem; }
  nav .links a {
    color: var(--text-muted);
    font-size: 0.95rem;
    transition: color 0.2s;
  }
  nav .links a:hover { color: var(--text); }

  /* Container */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    margin-bottom: 1.5rem;
  }
  .card h2 {
    font-size: 1.3rem;
    margin-bottom: 1rem;
    color: var(--text);
  }

  /* Form elements */
  input[type="text"], input[type="url"] {
    width: 100%;
    padding: 0.85rem 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--primary); }
  input::placeholder { color: var(--text-muted); }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.8rem 1.5rem;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }
  .btn-sm {
    padding: 0.4rem 0.8rem;
    font-size: 0.85rem;
  }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .btn-outline:hover {
    border-color: var(--primary);
    color: var(--text);
  }

  /* Result box */
  .result-box {
    background: var(--surface2);
    border: 1px solid var(--success);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-top: 1.5rem;
    text-align: center;
  }
  .result-box .short-url {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--success);
    word-break: break-all;
    display: block;
    margin: 0.75rem 0;
  }
  .result-box .original {
    color: var(--text-muted);
    font-size: 0.85rem;
    word-break: break-all;
  }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  td { color: var(--text); }
  tr:hover td { background: rgba(233, 69, 96, 0.05); }

  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 99px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge-active { background: rgba(100,255,218,0.15); color: var(--success); }
  .badge-inactive { background: rgba(233,69,96,0.15); color: var(--primary); }

  .truncate {
    max-width: 250px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: inline-block;
    vertical-align: middle;
  }

  /* Pagination */
  .pagination {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1.5rem;
  }

  /* Stat cards */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    text-align: center;
  }
  .stat-card .number {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
  }
  .stat-card .label {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 0.4rem;
  }

  /* Copy button */
  .copy-btn {
    background: none;
    border: 1px solid var(--success);
    color: var(--success);
    padding: 0.4rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .copy-btn:hover {
    background: var(--success);
    color: var(--bg);
  }

  /* Form row */
  .form-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }
  .form-row .grow { flex: 1; }

  .form-group { margin-bottom: 0.75rem; }
  .form-group label {
    display: block;
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 0.3rem;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
  }
  .empty h3 { margin-bottom: 0.5rem; color: var(--text); }

  footer {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
    font-size: 0.8rem;
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/" class="brand">⚡ <span>Snip</span>Link</a>
    <div class="links">
      <a href="/">Shorten</a>
      <a href="/dashboard">Dashboard</a>
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <footer>SnipLink URL Shortener &middot; Built with FastAPI</footer>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
